cat > tools/prepare_android.py <<'EOF'
#!/usr/bin/env python3
"""Run after `flutter create`: makes the generated Android project ready for My Forex AI.

* adds the INTERNET permission (needed to talk to your backend)
* sets the app name shown on the phone
* turns off Android auto-backup so the saved API token is not copied to cloud backups
"""
import pathlib
import re
import sys

manifest = pathlib.Path("android/app/src/main/AndroidManifest.xml")
if not manifest.exists():
    sys.exit("AndroidManifest.xml not found - run `flutter create --platforms=android .` first.")

text = manifest.read_text(encoding="utf-8")

if "android.permission.INTERNET" not in text:
    text = text.replace(
        "<application",
        '<uses-permission android:name="android.permission.INTERNET"/>\n    <application',
        1,
    )

text = re.sub(r'android:label="[^"]*"', 'android:label="My Forex AI"', text, count=1)

if "android:allowBackup" not in text:
    text = text.replace("<application", '<application\n        android:allowBackup="false"', 1)

manifest.write_text(text, encoding="utf-8")

final = manifest.read_text(encoding="utf-8")
assert "android.permission.INTERNET" in final, "INTERNET permission missing"
assert 'android:label="My Forex AI"' in final, "app label not set"
print("AndroidManifest.xml prepared:")
print(final)
EOF

cat > ../.github/workflows/build-apk.yml <<'EOF'
name: Build Android APK

on:
  workflow_dispatch:        # lets you press "Run workflow" manually
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.x"
          cache: true

      - name: Create the Android project files
        run: |
          flutter --version
          flutter create --platforms=android --org com.myforexai --project-name my_forex_ai .
          rm -f test/widget_test.dart
          python3 tools/prepare_android.py

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter build apk --release
        run: flutter build apk --release

      - name: Name the APK
        run: cp build/app/outputs/flutter-apk/app-release.apk My-Forex-AI.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: My-Forex-AI-APK
          path: mobile/My-Forex-AI.apk
          if-no-files-found: error
EOF
